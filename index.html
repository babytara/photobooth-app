<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ayo's Booth">
<meta name="theme-color" content="#1b0f24">
<title>Ayomide's 21st Photo Booth</title>
<style>
  :root{
    --plum:#2b1238; --night:#1b0f24; --gold:#f6c945; --gold-deep:#a67a10;
    --pink:#ff6fb1; --pink-deep:#9a3d73; --lilac:#c7a6ff; --lilac-deep:#6c4fa8; --cream:#fff6e6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--night)}
  body{
    position:fixed;inset:0;touch-action:manipulation;color:var(--cream);
    font-family:ui-rounded,"SF Pro Rounded","Avenir Next Rounded","Avenir Next",system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 8%, #5c2172 0, transparent 42%),
      radial-gradient(circle at 90% 92%, #6d1f52 0, transparent 48%),
      linear-gradient(160deg,#2b1238 0%,#1b0f24 60%,#12091a 100%);
    display:grid;grid-template-rows:auto 1fr auto auto auto;gap:14px;
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 22px)
            calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 22px);
  }

  /* twinkling background stars */
  .sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .spark{position:absolute;animation:twinkle 3s ease-in-out infinite;opacity:.2}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8) rotate(0)}50%{opacity:.9;transform:scale(1.15) rotate(20deg)}}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{display:flex;align-items:center;gap:10px;margin:0}

  .spk{font-size:30px;color:var(--gold)}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .sub{margin-top:2px;font-size:17px;font-weight:700;color:var(--lilac);letter-spacing:2px;text-transform:uppercase}
  .gear{width:52px;height:52px;border-radius:50%;border:2px solid rgba(199,166,255,.35);
        background:rgba(255,255,255,.05);color:var(--lilac);font-size:26px;opacity:.55}

  .stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
  .frameWrap{position:relative;border-radius:16px;overflow:hidden;
    box-shadow:0 0 0 4px rgba(246,201,69,.45),0 0 0 10px rgba(255,111,177,.15),
               0 22px 60px rgba(0,0,0,.6),0 0 90px rgba(255,111,177,.25)}
  #preview{display:block;width:100%;height:100%}

  .status{position:absolute;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;
    padding:10px 22px;border-radius:999px;background:rgba(27,15,36,.85);border:2px solid var(--gold);
    color:var(--gold);font-size:22px;font-weight:900;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;font-weight:900;font-size:clamp(150px,32vw,300px);color:var(--gold);
    text-shadow:0 0 36px rgba(255,111,177,.9),0 10px 0 var(--pink-deep)}
  .countdown.show{animation:pop 1s ease-out forwards}
  @keyframes pop{0%{transform:scale(.3);opacity:0}22%{transform:scale(1.12);opacity:1}
                 70%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:0}}

  .camErr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:34px;text-align:center;background:rgba(27,15,36,.92)}
  .camErr p{font-size:22px;font-weight:700;line-height:1.35;color:var(--cream)}

  .hint{text-align:center;color:var(--lilac);font-size:19px;font-weight:700;min-height:24px}

  .filters{display:flex;gap:14px;justify-content:center}
  .chip{flex:1;max-width:230px;height:74px;border-radius:999px;border:3px solid rgba(199,166,255,.45);
    background:rgba(255,255,255,.06);color:var(--cream);font:inherit;font-size:23px;font-weight:900;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .15s}
  .chip.on{background:linear-gradient(135deg,var(--lilac),var(--pink));border-color:var(--gold);color:var(--plum);
    transform:scale(1.04);box-shadow:0 6px 22px rgba(255,111,177,.45)}

  .actions{display:flex;gap:18px;justify-content:center}
  .btn{height:108px;border:none;border-radius:999px;font:inherit;font-size:36px;font-weight:900;color:var(--plum);
    display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .08s,box-shadow .08s}
  .btn[disabled]{opacity:.45}
  .btn.shoot{flex:1;max-width:600px;background:linear-gradient(135deg,var(--gold) 0%,#ffb35c 45%,var(--pink) 100%);
    box-shadow:0 10px 0 var(--pink-deep),0 20px 44px rgba(255,111,177,.45)}
  .btn.shoot:not([disabled]):active{transform:translateY(7px);box-shadow:0 3px 0 var(--pink-deep),0 10px 24px rgba(255,111,177,.4)}
  .btn.retake{flex:1;max-width:320px;background:var(--lilac);box-shadow:0 9px 0 var(--lilac-deep)}
  .btn.save{flex:1;max-width:320px;background:linear-gradient(135deg,var(--gold),#ffe08a);box-shadow:0 9px 0 var(--gold-deep)}
  .btn.retake:active,.btn.save:not([disabled]):active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .btn.small{height:76px;font-size:26px;padding:0 40px;flex:none}

  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
  .flash.go{animation:flash .55s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translate(-50%,20px);
    max-width:86vw;padding:16px 26px;border-radius:22px;background:var(--cream);color:var(--plum);
    font-size:21px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:all .25s;z-index:60;
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .panel{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,5,15,.7)}
  .card{width:min(560px,88vw);padding:30px;border-radius:28px;background:var(--plum);border:3px solid var(--gold);
    display:flex;flex-direction:column;gap:16px}
  .card h2{font-size:28px;color:var(--gold)}
  .card p{font-size:18px;line-height:1.4;color:var(--cream)}
  .card .btn{height:72px;font-size:24px;width:100%}

  .video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="sky" id="sky"></div>

<header>
  <div>
    <h1><span class="vh">Ayomide's 21st</span><span class="script" aria-hidden="true"></span><span class="spk">✦</span></h1>
    <div class="sub">Photo Booth · 28.09.26</div>
  </div>
  <button class="gear" id="gearBtn" aria-label="Settings (press and hold)">⚙︎</button>
</header>

<main class="stage" id="stage">
  <div class="frameWrap" id="frameWrap">
    <canvas id="preview"></canvas>
    <div class="status hidden" id="status"></div>
    <div class="countdown" id="countdown"></div>
    <div class="camErr hidden" id="camErr">
      <p id="camErrMsg"></p>
      <button class="btn retake small" id="camRetry">Try again</button>
    </div>
  </div>
</main>

<div class="hint" id="hint"></div>

<div class="filters" id="filters">
  <button class="chip on" data-f="normal">✨ Normal</button>
  <button class="chip" data-f="bw">🖤 B&amp;W</button>
  <button class="chip" data-f="vintage">🎞️ Vintage</button>
</div>

<div class="actions">
  <button class="btn shoot" id="shootBtn" disabled>📸 Take Photo</button>
  <button class="btn retake hidden" id="retakeBtn">↺ Retake</button>
  <button class="btn save hidden" id="saveBtn" disabled>⬇ Save</button>
</div>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<div class="panel hidden" id="panel">
  <div class="card">
    <h2>Booth settings</h2>
    <p id="frameInfo"></p>
    <button class="btn save" id="pickFrame">Choose frame PNG…</button>
    <button class="btn retake" id="clearFrame">Forget chosen frame</button>
    <button class="btn retake" id="closePanel">Close</button>
    <input type="file" id="fileInput" accept="image/png,image/*" class="hidden">
  </div>
</div>

<video id="video" class="video" playsinline muted autoplay></video>

function pad(list){ return list.map(s => ({x:s.x-BLEED, y:s.y-BLEED, w:s.w+BLEED*2, h:s.h+BLEED*2})); }

/* ================= FILTERS (pixel manipulation, no ctx.filter) ================= */
const vigCache = new Map(), noiseCache = new Map();
function vignette(w, h){
  const k = w + 'x' + h; let v = vigCache.get(k); if (v) return v;
  v = new Float32Array(w * h);
  for (let y = 0; y < h; y++){
    const dy = (y / (h - 1)) * 2 - 1;
    for (let x = 0; x < w; x++){
      const dx = (x / (w - 1)) * 2 - 1;
      const d = (dx*dx + dy*dy) / 2;
      v[y*w + x] = 1 - 0.38*d*d - 0.08*d;
    }
  }
  vigCache.set(k, v); return v;
}
function grain(w, h){
  const k = w + 'x' + h; let g = noiseCache.get(k); if (g) return g;
  g = new Int8Array(w * h); let s = 1234567;
  for (let i = 0; i < g.length; i++){ s = (s * 1103515245 + 12345) & 0x7fffffff; g[i] = (s % 17) - 8; }
  noiseCache.set(k, g); return g;
}
function applyFilter(img, type){
  if (type === 'normal') return img;
  const d = img.data, n = d.length;
  if (type === 'bw'){
    for (let i = 0; i < n; i += 4){
      let y = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      y = (y - 128) * 1.15 + 128;
      d[i] = d[i+1] = d[i+2] = y;           // Uint8ClampedArray clamps for us
    }
  } else if (type === 'vintage'){
    const v = vignette(img.width, img.height), g = grain(img.width, img.height);
    for (let i = 0, p = 0; i < n; i += 4, p++){
      const r = d[i], gg = d[i+1], b = d[i+2];
      const sr = .393*r + .769*gg + .189*b, sg = .349*r + .686*gg + .168*b, sb = .272*r + .534*gg + .131*b;
      let R = r*.4 + sr*.6, G = gg*.4 + sg*.6, B = b*.4 + sb*.6;
      R = R*.86 + 28; G = G*.84 + 20; B = B*.78 + 22;       // faded, warm blacks
      const k = v[p], z = g[p];
      d[i] = R*k + z; d[i+1] = G*k + z; d[i+2] = B*k + z;
    }
  }
  return img;
}
function makeFiltered(src){
  if (filter === 'normal') return src;
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  x.putImageData(applyFilter(x.getImageData(0, 0, c.width, c.height), filter), 0, 0);
  return c;
}

/* ================= DRAWING ================= */
function drawCover(ctx, vid, dx, dy, dw, dh, mirror){
  const vw = vid.videoWidth, vh = vid.videoHeight; if (!vw || !vh) return;
  const s = Math.max(dw / vw, dh / vh), sw = dw / s, sh = dh / s;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  ctx.save();
  if (mirror){ ctx.translate(dx + dw, dy); ctx.scale(-1, 1); ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, dw, dh); }
  else ctx.drawImage(vid, sx, sy, sw, sh, dx, dy, dw, dh);
  ctx.restore();
}

function drawStar(c, cx, cy, R, r, rot){
  c.beginPath();
  for (let i = 0; i < 10; i++){
    const rad = i % 2 ? r : R, a = rot + i * Math.PI / 5 - Math.PI / 2;
    c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  c.closePath();
  const g = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  g.addColorStop(0, '#f3d27a'); g.addColorStop(.5, '#c9a14a'); g.addColorStop(1, '#a8812f');
  c.fillStyle = g; c.fill();
}
// Used only when no frame PNG is available: recreates your template with see-through windows
function drawFallbackFrame(c){
  c.save();
  c.beginPath(); c.rect(0, 0, W, H);
  DEFAULT_SLOTS.forEach(s => c.rect(s.x, s.y, s.w, s.h));
  c.fillStyle = '#1e1a26'; c.fill('evenodd');
  drawStar(c, 625, 905, 140, 58, -0.2);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.font = '150px "Snell Roundhand","Brush Script MT","Apple Chancery",cursive';
  c.fillText("Ayomide's 21st", 640, 1830);
  c.font = 'bold 58px "Helvetica Neue",Helvetica,Arial,sans-serif';
  c.fillText('28.09.26', 630, 1910);
  c.restore();
}
function drawOverlay(c){
  if (frameImg) c.drawImage(frameImg, 0, 0, W, H); else drawFallbackFrame(c);
}

const live = document.createElement('canvas');
const lctx = live.getContext('2d', {willReadFrequently: true});
function updateLive(){
  const sl = slots[0];
  const lw = Math.max(1, Math.round(sl.w * PREVIEW_SCALE)), lh = Math.max(1, Math.round(sl.h * PREVIEW_SCALE));
  if (live.width !== lw || live.height !== lh){ live.width = lw; live.height = lh; }
  drawCover(lctx, video, 0, 0, lw, lh, true);
  if (filter !== 'normal') lctx.putImageData(applyFilter(lctx.getImageData(0, 0, lw, lh), filter), 0, 0);
}

function render(t){
  requestAnimationFrame(render);
  const c = pctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#1e1a26'; c.fillRect(0, 0, preview.width, preview.height);
  c.setTransform(PREVIEW_SCALE, 0, 0, PREVIEW_SCALE, 0, 0);
  const anyEmpty = photos.some(p => !p);
  const showLive = camReady && anyEmpty && video.videoWidth > 0;
  if (showLive) updateLive();
  slots.forEach((sl, i) => {
    if (filtered[i]) c.drawImage(filtered[i], sl.x, sl.y, sl.w, sl.h);
    else if (showLive) c.drawImage(live, sl.x, sl.y, sl.w, sl.h);
    else { c.fillStyle = '#5f5a64'; c.fillRect(sl.x, sl.y, sl.w, sl.h); }
  });
  drawOverlay(c);
  if (state === 'shooting' && current >= 0){
    const sl = slots[current], a = 0.55 + 0.45 * Math.sin(t / 140);
    c.strokeStyle = `rgba(246,201,69,${a})`; c.lineWidth = 16;
    c.strokeRect(sl.x + BLEED + 8, sl.y + BLEED + 8, sl.w - BLEED*2 - 16, sl.h - BLEED*2 - 16);
  }
}
requestAnimationFrame(render);

/* ================= EXPORT ================= */
function buildExport(){
  const token = ++exportToken;
  finalBlob = null; saveBtn.disabled = true;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const c = out.getContext('2d');
  c.fillStyle = '#1e1a26'; c.fillRect(0, 0, W, H);
  slots.forEach((sl, i) => { if (filtered[i]) c.drawImage(filtered[i], sl.x, sl.y, sl.w, sl.h); });
  drawOverlay(c);
  out.toBlob(b => {
    if (token !== exportToken || !b) return;
    if (finalUrl) URL.revokeObjectURL(finalUrl);
    finalBlob = b; finalUrl = URL.createObjectURL(b);
    saveBtn.disabled = false;
  }, 'image/jpeg', JPEG_QUALITY);
}

async function save(){
  if (!finalBlob) return;
  unlockAudio();
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `ayomide-21st-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  const file = new File([finalBlob], name, {type: 'image/jpeg'});
  if (navigator.canShare && navigator.canShare({files: [file]})){
    try {
      await navigator.share({files: [file]});   // files only, so iOS offers "Save Image"
      toast('Saved! 🎉 Tap Retake for the next guest');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = finalUrl; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Downloaded! Find it in Files › Downloads');
}

/* ================= CAPTURE FLOW ================= */
function capture(i){
  const sl = slots[i];
  const cv = document.createElement('canvas'); cv.width = sl.w; cv.height = sl.h;
  drawCover(cv.getContext('2d'), video, 0, 0, sl.w, sl.h, true);
  photos[i] = cv; filtered[i] = makeFiltered(cv);
}
async function countdown(){
  for (let n = COUNTDOWN_SECONDS; n >= 1; n--){
    cd.textContent = n;
    cd.classList.remove('show'); void cd.offsetWidth; cd.classList.add('show');
    beep(n === 1 ? 880 : 660, .14);
    await sleep(1000);
  }
  cd.classList.remove('show');
}
function flash(){
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
async function runSequence(indices){
  if (busy || !camReady) return;
  busy = true; state = 'shooting'; setUI();
  for (let k = 0; k < indices.length; k++){
    const i = indices[k];
    photos[i] = null; filtered[i] = null; current = i;
    showStatus(indices.length > 1 ? `Photo ${k+1} of ${indices.length}` : 'Retaking this one!');
    await countdown();
    flash(); shutter(); capture(i);
    if (k < indices.length - 1){
      showStatus(['Gorgeous! 💖', 'Next pose… ✨', 'Serve it! ⭐', 'Nice one! 🎉'][k % 4]);
      await sleep(SHOT_GAP_MS);
    }
  }
  current = -1;
  await sleep(450);
  hideStatus();
  state = 'review'; busy = false; setUI();
  buildExport();
}
function retakeAll(){
  if (busy) return;
  resetPhotos(); state = 'idle'; finalBlob = null; exportToken++;
  setUI();
}

/* ================= UI ================= */
function setUI(){
  const review = state === 'review';
  shootBtn.classList.toggle('hidden', review);
  retakeBtn.classList.toggle('hidden', !review);
  saveBtn.classList.toggle('hidden', !review);
  shootBtn.disabled = state === 'shooting' || !camReady;
  retakeBtn.disabled = busy;
  if (state === 'idle') hintEl.textContent = `Strike a pose — ${slots.length} photos, ${COUNTDOWN_SECONDS} seconds each!`;
  else if (state === 'shooting') hintEl.textContent = 'Look at the camera! 👀';
  else hintEl.textContent = 'Tap any photo to retake just that one';
}
function showStatus(t){ statusEl.textContent = t; statusEl.classList.remove('hidden'); }
function hideStatus(){ statusEl.classList.add('hidden'); }
let toastTimer;
function toast(msg, ms = 3000){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}
function setFilter(f){
  filter = f;
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  filtered = photos.map(p => p ? makeFiltered(p) : null);
  if (state === 'review') buildExport();
}

function fit(){
  const r = stage.getBoundingClientRect(), a = W / H;
  let w = r.width, h = w / a;
  if (h > r.height){ h = r.height; w = h * a; }
  frameWrap.style.width = Math.floor(w) + 'px';
  frameWrap.style.height = Math.floor(h) + 'px';
}
new ResizeObserver(fit).observe(stage);
window.addEventListener('orientationchange', () => setTimeout(fit, 300));
fit();

(function sky(){
  const s = $('sky'), chars = ['✦', '★', '✧', '•'], cols = ['#f6c945', '#ff6fb1', '#c7a6ff'];
  for (let i = 0; i < 22; i++){
    const e = document.createElement('span'); e.className = 'spark';
    e.textContent = chars[i % chars.length];
    e.style.left = Math.random() * 100 + '%'; e.style.top = Math.random() * 100 + '%';
    e.style.fontSize = (12 + Math.random() * 26) + 'px'; e.style.color = cols[i % cols.length];
    e.style.animationDelay = (Math.random() * 3) + 's'; e.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
    s.appendChild(e);
  }
})();

/* ================= SOUND ================= */
let actx = null;
function unlockAudio(){
  if (!actx){ const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur){
  const a = actx; if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function shutter(){
  const a = actx; if (!a) return;
  const len = Math.floor(a.sampleRate * .09), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = a.createBufferSource(), g = a.createGain(); g.gain.value = .5;
  src.buffer = buf; src.connect(g); g.connect(a.destination); src.start();
}

/* ================= CAMERA ================= */
function showErr(msg){ $('camErrMsg').textContent = msg; $('camErr').classList.remove('hidden'); }
async function startCamera(){
  $('camErr').classList.add('hidden');
  if (!window.isSecureContext){ showErr('The camera needs a secure https:// link. Open the booth from your GitHub Pages address.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showErr('This browser can’t use the camera. Open the booth in Safari.'); return; }
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    camReady = false; setUI();
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: 'user', width: {ideal: 1920}, height: {ideal: 1440}}, audio: false
    });
    video.srcObject = stream;
    await video.play();
    for (let i = 0; i < 50 && !video.videoWidth; i++) await sleep(100);
    camReady = video.videoWidth > 0;
    if (!camReady) throw new Error('no frames');
    setUI();
  } catch (e) {
    camReady = false; setUI();
    const n = e && e.name;
    if (n === 'NotAllowedError') showErr('Camera access is blocked. On the iPad go to Settings › Safari › Camera › Allow, then tap Try again.');
    else if (n === 'NotFoundError') showErr('No front camera found.');
    else if (n === 'NotReadableError') showErr('The camera is busy in another app. Close it and tap Try again.');
    else showErr('Couldn’t start the camera. Tap Try again.');
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  keepAwake();
  const tr = stream && stream.getVideoTracks()[0];
  if (!tr || tr.readyState === 'ended') startCamera();
  else video.play().catch(() => {});
});

let wakeLock = null;
async function keepAwake(){
  try {
    if ('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}

/* ================= FRAME PNG ================= */
function loadImage(src){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
// Finds the transparent photo windows in the frame, in reading order
function detectSlots(img){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data;
  const step = 4, gw = Math.ceil(W / step), gh = Math.ceil(H / step);
  const t = new Uint8Array(gw * gh), seen = new Uint8Array(gw * gh);
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++){
    const px = Math.min(W - 1, gx * step), py = Math.min(H - 1, gy * step);
    t[gy * gw + gx] = d[(py * W + px) * 4 + 3] < 40 ? 1 : 0;
  }
  const boxes = [];
  for (let i = 0; i < t.length; i++){
    if (!t[i] || seen[i]) continue;
    let minx = gw, miny = gh, maxx = 0, maxy = 0, count = 0;
    const st = [i]; seen[i] = 1;
    while (st.length){
      const j = st.pop(), jx = j % gw, jy = (j / gw) | 0; count++;
      if (jx < minx) minx = jx; if (jx > maxx) maxx = jx; if (jy < miny) miny = jy; if (jy > maxy) maxy = jy;
      const nb = [jx > 0 ? j - 1 : -1, jx < gw - 1 ? j + 1 : -1, jy > 0 ? j - gw : -1, jy < gh - 1 ? j + gw : -1];
      for (const k of nb) if (k >= 0 && t[k] && !seen[k]){ seen[k] = 1; st.push(k); }
    }
    const touchesEdge = minx === 0 || miny === 0 || maxx === gw - 1 || maxy === gh - 1;
    if (!touchesEdge && count * step * step > 40000)
      boxes.push({x: minx * step, y: miny * step, w: (maxx - minx + 1) * step, h: (maxy - miny + 1) * step});
  }
  boxes.sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2));
  const rows = [];
  boxes.forEach(b => {
    const cy = b.y + b.h / 2, row = rows.find(r => Math.abs(r.cy - cy) < b.h / 2);
    if (row) row.items.push(b); else rows.push({cy, items: [b]});
  });
  return rows.flatMap(r => r.items.sort((a, b) => a.x - b.x)).slice(0, 8);
}
function useFrame(im, source){
  frameImg = im; frameSource = source;
  if (im){
    const found = detectSlots(im);
    if (found.length) slots = pad(found);
    else {
      slots = pad(DEFAULT_SLOTS);
      toast('⚠️ This frame has no see-through photo windows, so photos will be hidden. Export it as a PNG with transparent windows.', 7000);
    }
  } else slots = pad(DEFAULT_SLOTS);
  exportToken++; finalBlob = null;
  resetPhotos(); state = 'idle'; setUI(); updateFrameInfo();
}
function updateFrameInfo(){
  const src = {saved: 'the PNG you chose on this iPad', embedded: 'the frame built into the app', file: FRAME_FILE, none: 'the built-in stand-in (no PNG loaded yet)'}[frameSource];
  $('frameInfo').textContent = `Frame: ${src}. Photo windows found: ${slots.length}.`;
}
async function initFrame(){
  let stored = null;
  try { stored = localStorage.getItem(STORE_KEY); } catch (e) {}
  const tries = [];
  if (stored) tries.push(['saved', stored]);
  if (EMBEDDED_FRAME) tries.push(['embedded', EMBEDDED_FRAME]);
  tries.push(['file', FRAME_FILE]);
  for (const [kind, src] of tries){
    try { useFrame(await loadImage(src), kind); return; } catch (e) {}
  }
  useFrame(null, 'none');
}

/* ================= EVENTS ================= */
shootBtn.addEventListener('click', () => {
  unlockAudio(); keepAwake();
  resetPhotos();
  runSequence(slots.map((_, i) => i));
});
retakeBtn.addEventListener('click', () => { unlockAudio(); retakeAll(); });
saveBtn.addEventListener('click', save);
$('camRetry').addEventListener('click', startCamera);
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.f)));

preview.addEventListener('click', e => {
  if (state !== 'review' || busy) return;
  const r = preview.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  const i = slots.findIndex(s => x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h);
  if (i >= 0){ unlockAudio(); runSequence([i]); }
});

// Settings: press and hold the gear for 1 second (keeps guests out)
let holdTimer;
const gear = $('gearBtn');
gear.addEventListener('pointerdown', () => { holdTimer = setTimeout(() => { updateFrameInfo(); $('panel').classList.remove('hidden'); }, 900); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gear.addEventListener(ev, () => clearTimeout(holdTimer)));
gear.addEventListener('click', () => toast('Press and hold ⚙︎ for settings'));
$('closePanel').addEventListener('click', () => $('panel').classList.add('hidden'));
$('pickFrame').addEventListener('click', () => $('fileInput').click());
$('clearFrame').addEventListener('click', () => {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  initFrame(); toast('Back to the default frame');
});
$('fileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const im = await loadImage(fr.result);
      useFrame(im, 'saved');
      try { localStorage.setItem(STORE_KEY, fr.result); toast('Frame loaded and remembered ✨'); }
      catch (err) { toast('Frame loaded for this session (too big to remember)'); }
    } catch (err) { toast('Couldn’t read that image'); }
  };
  fr.readAsDataURL(f);
  e.target.value = '';
});

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
document.addEventListener('pointerdown', keepAwake, {once: true});

/* ================= GO ================= */
setUI();
initFrame();
startCamera();
})();
</script>
